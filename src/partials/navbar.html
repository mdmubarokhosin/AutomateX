<header class="fixed nav-sticky transition-all duration-300 inset-x-0 top-0 z-60 w-full lg:py-7.5 md:py-5 py-3.75" id="main-header">
    <div class="container">
        <!-- Navbar Floating Container -->
        <div class="relative">

            <!-- Inner Layer (White pill background) -->
            <div class="bg-white shadow-sm border border-default-200/50 md:rounded-2xl rounded-lg flex items-center justify-between ps-5 pe-2.5 py-2.5">

                <!-- LOGO -->
                <a href="index.html" class="flex items-center shrink-0">
                    <img src="/images/logo.svg" loading="lazy" alt="Automatex Logo" class="h-7 object-contain">
                </a>

                <!-- CENTER MENU -->
                <nav class="hidden lg:flex items-center justify-center flex-1 z-10">
                    <div class="flex items-center text-base font-normal gap-4">
                        <a href="index.html" class="nav-link" data-i18n="nav.home">Home</a>
                        <a href="agents.html" class="nav-link" data-i18n="nav.agents">Agents</a>
                        <a href="pricing.html" class="nav-link" data-i18n="nav.pricing">Pricing</a>
                        <a href="features.html" class="nav-link" data-i18n="nav.features">Features</a>
                        <a href="contact-us.html" class="nav-link" data-i18n="nav.contact">Contact us</a>
                    </div>
                </nav>

                <!-- RIGHT BUTTON & HAMBURGER -->
                <div class="flex items-center gap-3 z-20 shrink-0">
                    <!-- ভাষা সুইচার -->
                    <div class="lang-switcher">
                        <button type="button" class="lang-switcher-btn" aria-label="Language" data-i18n-aria="nav.language">
                            <i class="iconify tabler--language size-4"></i>
                            <span data-lang-current>English</span>
                            <i class="iconify tabler--chevron-down size-3.5"></i>
                        </button>
                        <div class="lang-switcher-menu" role="menu">
                            <button type="button" class="lang-option" data-lang-option="en" role="menuitem">
                                <span>English</span>
                            </button>
                            <button type="button" class="lang-option" data-lang-option="bn" role="menuitem">
                                <span>বাংলা</span>
                            </button>
                        </div>
                    </div>

                    <!-- Get started Button -->
                    <a href="contact-us.html" class="hidden md:inline-flex bg-default-950 text-white rounded-lg shadow-lg group overflow-hidden">
                        <div class="relative flex items-center justify-center px-6 h-10 text-sm font-medium">
                            <!-- Invisible placeholder to set accurate button width -->
                            <span class="invisible" data-i18n="nav.getStarted">Get started</span>
                            <!-- Sliding text out -->
                            <span class="absolute transition-transform duration-300 ease-out group-hover:-translate-y-[150%]" data-i18n="nav.getStarted">Get started</span>
                            <!-- Sliding text in -->
                            <span class="absolute transition-transform duration-300 ease-out translate-y-[150%] group-hover:translate-y-0" data-i18n="nav.getStarted">Get started</span>
                        </div>
                    </a>

                    <!-- Mobile Hamburger -->
                    <button type="button" class="hs-collapse-toggle lg:hidden flex items-center justify-center size-9 bg-default-200 rounded-lg text-default-900 transition-all duration-300 cursor-pointer hover:bg-default-200" data-hs-collapse="#mobile-menu" aria-controls="mobile-menu" data-i18n-aria="nav.toggle">
                        <i class="iconify tabler--menu-2 size-5"></i>
                    </button>
                </div>

            </div>

            <!-- Mobile Menu Collapse -->
            <div id="mobile-menu" class="hs-collapse hidden overflow-hidden transition-all duration-300 absolute top-full inset-x-0 w-full mt-2 lg:hidden z-60">
                <div class="bg-white shadow-xl rounded-2xl p-3">
                    <div class="flex flex-col gap-2.5 text-start">
                        <a class="text-base nav-link" href="index.html" data-i18n="nav.home">Home</a>
                        <a class="text-base nav-link" href="agents.html" data-i18n="nav.agents">Agents</a>
                        <a class="text-base nav-link" href="pricing.html" data-i18n="nav.pricing">Pricing</a>
                        <a class="text-base nav-link" href="features.html" data-i18n="nav.features">Features</a>
                        <a class="text-base nav-link" href="contact-us.html" data-i18n="nav.contact">Contact us</a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</header>
