# Yarn 4 কনফিগারেশন — AutomateX
# Cloudflare Pages এর yarn 4 কে lockfile মাইগ্রেশন করতে দেয় যাতে বিল্ড সফল হয়।
# যেহেতু lockfile রিপোজিটরিতে নেই, yarn নতুন তৈরি করবে।

# ইমিউটেবল চেক বন্ধ করুন (lockfile মাইগ্রেশন অনুমোদিত)
enableImmutableInstalls: false

# প্লাগ-ইন সক্ষম করুন
enableTelemetry: false

# গ্লোবাল ক্যাশে ব্যবহার করুন
enableGlobalCache: true

# নেটওয়ার্ক কনফিগারেশন
nmSelfReferences: false

# প্লাগ-এন্ড-প্লে মোড (যদি প্রয়োজন হয় তবে node-modules লিঙ্কের পরিবর্তে)
nodeLinker: node-modules
